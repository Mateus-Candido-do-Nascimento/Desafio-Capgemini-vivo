<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OlhoVivo AI — Câmera</title>
  <link rel="stylesheet" href="css/camera.css">
</head>
<body>

  <h1>⬡ OLHOVIVO AI — SENSOR VISUAL</h1>

  <div id="videoWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="poseCanvas"></canvas>
  </div>

  <div id="estadoBox">
    <div id="estadoAtual">—</div>
    <div id="confiancaBadge">CONF —%<br>frames: <span id="frameCount">0</span></div>
  </div>

  <div id="debugPanel">
    <div class="debug-title">CALIBRAÇÃO — VALORES EM TEMPO REAL</div>
    <div class="debug-row">
      <span class="debug-label">lean_front</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_lean" style="background:var(--cyan);width:0%"></div></div>
        <span class="debug-val" id="v_lean">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">shoulder_dx</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_sdx" style="background:var(--yellow);width:0%"></div></div>
        <span class="debug-val" id="v_sdx">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">arm_raised</span>
      <span class="debug-val" id="v_arm">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">head_down</span>
      <span class="debug-val" id="v_head">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">attention_score</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_att" style="background:var(--green);width:0%"></div></div>
        <span class="debug-val good" id="v_att">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">hesitation_score</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_hes" style="background:var(--red);width:0%"></div></div>
        <span class="debug-val" id="v_hes">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">visibility</span>
      <span class="debug-val" id="v_vis">—</span>
    </div>
    <div class="debug-row" style="margin-top:4px;border-top:1px solid var(--border);padding-top:4px;">
      <span class="debug-label">→ local (sem backend)</span>
      <span class="debug-val" id="v_estado_local">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">→ backend (IA)</span>
      <span class="debug-val good" id="v_estado_backend">—</span>
    </div>
  </div>

  <div id="backendConfig">
    <input id="backendInput" type="url" placeholder="URL do backend (ngrok ou localhost)">
    <button id="btnSave" onclick="salvarBackend()">SALVAR</button>
  </div>

  <div id="statusRow">
    <span>Status: <span id="statusTxt">aguardando</span></span>
    <span>Intervalo: <span id="intervaloTxt">2000ms</span></span>
  </div>

  <div id="btnGroup" style="width:100%;max-width:380px;display:flex;gap:8px;">
    <button id="btnFrontal" onclick="iniciar('user')"
      style="flex:1;padding:14px 8px;background:rgba(0,180,255,.12);border:1px solid var(--cyan);border-radius:8px;color:var(--cyan);font-family:monospace;font-size:12px;letter-spacing:.08em;cursor:pointer;">
      ◉ FRONTAL
    </button>
    <button id="btnTraseira" onclick="iniciar('environment')"
      style="flex:1;padding:14px 8px;background:rgba(0,180,255,.04);border:1px solid rgba(0,180,255,.3);border-radius:8px;color:#4a5a70;font-family:monospace;font-size:12px;letter-spacing:.08em;cursor:pointer;">
      ◎ TRASEIRA
    </button>
  </div>

  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>

  <script src="js/camera-config.js"></script>
  <script src="js/camera-sender.js"></script>
  <script src="js/camera-inference.js"></script>
  <script src="js/camera-mediapipe.js"></script>

</body>
</html>
