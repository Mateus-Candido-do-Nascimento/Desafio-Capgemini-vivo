<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OlhoVivo AI — Câmera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #07090f; --panel: #0d1117;
      --border:rgba(0,180,255,0.15);
      --cyan:  #00b4ff; --green: #00e5a0;
      --yellow:#ffd060; --red:   #ff3d5a; --dim: #4a5a70;
    }
    body { background:var(--bg); color:#c8d6e5; font-family:'Share Tech Mono',monospace;
           min-height:100vh; display:flex; flex-direction:column;
           align-items:center; padding:12px; gap:10px; }
    h1 { font-size:12px; color:var(--cyan); letter-spacing:.12em; text-align:center; }

    #videoWrap { position:relative; width:100%; max-width:380px; }
    video      { width:100%; border-radius:8px; border:1px solid var(--border); display:none; }
    
   #poseCanvas { position:relative; width:100%; max-width:380px; height:285px; border-radius:8px; border:1px solid var(--border); display:block; }

    #estadoBox { width:100%; max-width:380px; background:var(--panel);
                 border:1px solid var(--border); border-radius:8px;
                 padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
    #estadoAtual { font-size:22px; font-weight:bold; letter-spacing:.1em; color:var(--cyan); transition:color .3s; }
    #confiancaBadge { font-size:11px; color:var(--dim); text-align:right; }

    #debugPanel { width:100%; max-width:380px; background:var(--panel);
                  border:1px solid var(--border); border-radius:8px; padding:10px 14px; }
    .debug-title { font-size:9px; color:var(--dim); letter-spacing:.1em;
                   margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:4px; }
    .debug-row   { display:flex; justify-content:space-between; align-items:center;
                   padding:3px 0; font-size:11px; border-bottom:1px solid rgba(0,180,255,.05); }
    .debug-label { color:var(--dim); }
    .debug-val   { color:var(--cyan); font-weight:bold; }
    .debug-val.good   { color:var(--green); }
    .debug-val.warn   { color:var(--yellow); }
    .debug-val.danger { color:var(--red); }
    .bar-wrap { display:flex; align-items:center; gap:6px; }
    .bar-mini  { width:70px; height:5px; background:rgba(255,255,255,.05); border-radius:3px; overflow:hidden; }
    .bar-mini-fill { height:100%; border-radius:3px; transition:width .3s; }

    #statusRow { width:100%; max-width:380px; display:flex; justify-content:space-between; font-size:10px; color:var(--dim); }
    #statusRow span { color:var(--cyan); }

    #btnStart { width:100%; max-width:380px; padding:14px;
                background:rgba(0,180,255,.08); border:1px solid var(--cyan);
                border-radius:8px; color:var(--cyan); font-family:monospace;
                font-size:13px; letter-spacing:.1em; cursor:pointer; }
    #btnStart:active { background:rgba(0,180,255,.18); }

    #backendConfig { width:100%; max-width:380px; display:flex; gap:8px; align-items:center; }
    #backendInput  { flex:1; background:var(--panel); border:1px solid var(--border);
                     border-radius:6px; color:#c8d6e5; font-family:monospace;
                     font-size:10px; padding:8px 10px; outline:none; }
    #backendInput:focus { border-color:var(--cyan); }
    #btnSave { padding:8px 12px; background:rgba(0,180,255,.1); border:1px solid var(--border);
               border-radius:6px; color:var(--cyan); font-family:monospace;
               font-size:10px; cursor:pointer; white-space:nowrap; }

    #log { width:100%; max-width:380px; font-size:10px; color:var(--dim);
           max-height:100px; overflow-y:auto; line-height:1.7; }
    .log-ok   { color:var(--green); }
    .log-err  { color:var(--red); }
    .log-info { color:var(--cyan); }
  </style>
</head>
<body>

  <h1>⬡ OLHOVIVO AI — SENSOR VISUAL</h1>

  <div id="videoWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="poseCanvas"></canvas>
  </div>

  <div id="estadoBox">
    <div id="estadoAtual">—</div>
    <div id="confiancaBadge">CONF —%<br>frames: <span id="frameCount">0</span></div>
  </div>

  <div id="debugPanel">
    <div class="debug-title">CALIBRAÇÃO — VALORES EM TEMPO REAL</div>
    <div class="debug-row">
      <span class="debug-label">lean_front</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_lean" style="background:var(--cyan);width:0%"></div></div>
        <span class="debug-val" id="v_lean">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">shoulder_dx</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_sdx" style="background:var(--yellow);width:0%"></div></div>
        <span class="debug-val" id="v_sdx">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">arm_raised</span>
      <span class="debug-val" id="v_arm">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">head_down</span>
      <span class="debug-val" id="v_head">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">attention_score</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_att" style="background:var(--green);width:0%"></div></div>
        <span class="debug-val good" id="v_att">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">hesitation_score</span>
      <div class="bar-wrap">
        <div class="bar-mini"><div class="bar-mini-fill" id="b_hes" style="background:var(--red);width:0%"></div></div>
        <span class="debug-val" id="v_hes">—</span>
      </div>
    </div>
    <div class="debug-row">
      <span class="debug-label">visibility</span>
      <span class="debug-val" id="v_vis">—</span>
    </div>
    <div class="debug-row" style="margin-top:4px;border-top:1px solid var(--border);padding-top:4px;">
      <span class="debug-label">→ local (sem backend)</span>
      <span class="debug-val" id="v_estado_local">—</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">→ backend (IA)</span>
      <span class="debug-val good" id="v_estado_backend">—</span>
    </div>
  </div>

  <div id="backendConfig">
    <input id="backendInput" type="url" placeholder="URL do backend (ngrok ou localhost)">
    <button id="btnSave" onclick="salvarBackend()">SALVAR</button>
  </div>

  <div id="statusRow">
    <span>Status: <span id="statusTxt">aguardando</span></span>
    <span>Intervalo: <span id="intervaloTxt">2000ms</span></span>
  </div>

  <div id="btnGroup" style="width:100%;max-width:380px;display:flex;gap:8px;">
    <button id="btnFrontal" onclick="iniciar('user')"
      style="flex:1;padding:14px 8px;background:rgba(0,180,255,.12);border:1px solid var(--cyan);border-radius:8px;color:var(--cyan);font-family:monospace;font-size:12px;letter-spacing:.08em;cursor:pointer;">
      ◉ FRONTAL
    </button>
    <button id="btnTraseira" onclick="iniciar('environment')"
      style="flex:1;padding:14px 8px;background:rgba(0,180,255,.04);border:1px solid rgba(0,180,255,.3);border-radius:8px;color:#4a5a70;font-family:monospace;font-size:12px;letter-spacing:.08em;cursor:pointer;">
      ◎ TRASEIRA
    </button>
  </div>

  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <script>
    const INTERVALO_MS = 2000;
    const CORES = { idle:'#4a5a70', engajado:'#00b4ff', indeciso:'#ffd060', decisao:'#00e5a0', saindo:'#ff3d5a' };

    function detectarBackend() {
      const salvo = localStorage.getItem('olhovivo_backend');
      if (salvo) return salvo;
      const h = window.location.hostname;
      return (h === 'localhost' || h === '127.0.0.1')
        ? 'http://localhost:8000'
        : `${window.location.protocol}//${h}`;
    }

    let BACKEND = detectarBackend();
    document.getElementById('backendInput').value = BACKEND;

    function salvarBackend() {
      BACKEND = document.getElementById('backendInput').value.trim().replace(/\/$/, '');
      localStorage.setItem('olhovivo_backend', BACKEND);
      log('Backend salvo: ' + BACKEND, 'info');
    }

    const video      = document.getElementById('video');
    const poseCanvas = document.getElementById('poseCanvas');
    const poseCtx    = poseCanvas.getContext('2d');
    let frameCount = 0, enviando = false, ultimoEnvio = 0;

    function log(msg, tipo = '') {
      const el = document.createElement('div');
      el.className = tipo ? 'log-' + tipo : '';
      el.textContent = new Date().toTimeString().slice(0,8) + '  ' + msg;
      const logEl = document.getElementById('log');
      logEl.insertBefore(el, logEl.firstChild);
      if (logEl.children.length > 25) logEl.removeChild(logEl.lastChild);
    }

    // Espelha _inferir_estado do backend — câmera FRONTAL
    function inferirLocal(l) {
      const shoulder_y  = ((l[11]?.y ?? 0.4) + (l[12]?.y ?? 0.4)) / 2;
      const hip_y       = ((l[23]?.y ?? 0.6) + (l[24]?.y ?? 0.6)) / 2;
      const lean_front  = shoulder_y - hip_y;  // negativo em câmera frontal
      const shoulder_dx = Math.abs((l[11]?.x ?? 0.4) - (l[12]?.x ?? 0.6));
      const wrist_y_avg = ((l[15]?.y ?? 0.6) + (l[16]?.y ?? 0.6)) / 2;
      const arm_raised  = wrist_y_avg < shoulder_y;
      const head_down   = (l[0]?.y ?? 0.5) > shoulder_y - 0.08;  // threshold generoso
      const visibility  = l[11]?.visibility ?? 1.0;

      // attention: shoulder_dx alto = de frente = engajado
      const attention  = Math.min(1, Math.max(0,
        0.3 + shoulder_dx * 1.2 + (arm_raised ? 0.25 : 0) + (head_down ? 0.1 : 0)
      ));
      const hesitation = Math.min(1, Math.max(0, 0.8 - shoulder_dx * 2.0));

      let estado = 'idle';
      if (visibility < 0.4)                        estado = 'idle';
      else if (arm_raised && attention > 0.5)       estado = 'decisao';
      else if (shoulder_dx < 0.12)                  estado = 'saindo';
      else if (attention > 0.5 && hesitation < 0.5) estado = 'engajado';
      else if (hesitation > 0.45)                   estado = 'indeciso';
      else if (attention > 0.35)                    estado = 'engajado';

      return { lean_front, shoulder_dx, arm_raised, head_down, attention, hesitation, visibility, estado };
    }

    function atualizarDebug(m) {
      const fmt = v => v.toFixed(3);
      document.getElementById('v_lean').textContent = fmt(m.lean_front);
      document.getElementById('v_sdx').textContent  = fmt(m.shoulder_dx);
      document.getElementById('v_arm').textContent  = m.arm_raised ? 'SIM' : 'NÃO';
      document.getElementById('v_arm').className    = 'debug-val ' + (m.arm_raised ? 'good' : '');
      document.getElementById('v_head').textContent = m.head_down ? 'SIM' : 'NÃO';
      document.getElementById('v_vis').textContent  = fmt(m.visibility);
      document.getElementById('v_att').textContent  = Math.round(m.attention  * 100) + '%';
      document.getElementById('v_hes').textContent  = Math.round(m.hesitation * 100) + '%';
      document.getElementById('v_estado_local').textContent = m.estado.toUpperCase();
      document.getElementById('v_estado_local').style.color = CORES[m.estado] || '#4a5a70';

      document.getElementById('b_lean').style.width = Math.min(100, Math.max(0, (m.lean_front + 0.2) / 0.4 * 100)) + '%';
      document.getElementById('b_sdx').style.width  = Math.min(100, m.shoulder_dx / 0.5 * 100) + '%';
      document.getElementById('b_att').style.width  = (m.attention  * 100) + '%';
      document.getElementById('b_hes').style.width  = (m.hesitation * 100) + '%';
    }

    // Clamp garante 0.0–1.0 — MediaPipe pode retornar fora do range
    const cl = v => Math.min(1.0, Math.max(0.0, v ?? 0.5));

    function extrairBody(l) {
      return {
        nose_y:           cl(l[0]?.y),
        left_shoulder_x:  cl(l[11]?.x), left_shoulder_y:  cl(l[11]?.y),
        right_shoulder_x: cl(l[12]?.x), right_shoulder_y: cl(l[12]?.y),
        left_hip_x:       cl(l[23]?.x), left_hip_y:       cl(l[23]?.y),
        right_hip_x:      cl(l[24]?.x), right_hip_y:      cl(l[24]?.y),
        left_wrist_x:     cl(l[15]?.x), left_wrist_y:     cl(l[15]?.y),
        right_wrist_x:    cl(l[16]?.x), right_wrist_y:    cl(l[16]?.y),
        visibility:       cl(l[11]?.visibility),
      };
    }

    async function enviarFrame(landmarks) {
      if (enviando) return;
      enviando = true;
      try {
        const res  = await fetch(`${BACKEND}/sensor/frame`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(extrairBody(landmarks)),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        frameCount++;
        document.getElementById('frameCount').textContent = frameCount;

        const estado = data.estado || 'idle';
        const conf   = data.decisao?.confianca ?? 0;
        document.getElementById('estadoAtual').textContent = estado.toUpperCase();
        document.getElementById('estadoAtual').style.color = CORES[estado] || '#4a5a70';
        document.getElementById('confiancaBadge').innerHTML = `CONF ${Math.round(conf * 100)}%<br>frames: ${frameCount}`;
        document.getElementById('v_estado_backend').textContent  = estado.toUpperCase();
        document.getElementById('v_estado_backend').style.color  = CORES[estado] || '#4a5a70';
        document.getElementById('statusTxt').textContent = 'transmitindo';
        document.getElementById('statusTxt').style.color = '#00e5a0';
        log(`↑ ${estado} | conf=${Math.round(conf*100)}%`, 'ok');
      } catch (err) {
        document.getElementById('statusTxt').textContent = 'erro';
        document.getElementById('statusTxt').style.color = '#ff3d5a';
        log(`ERRO: ${err.message}`, 'err');
      } finally {
        enviando = false;
      }
    }

    function onResults(results) {
      poseCanvas.width  = video.videoWidth  || 640;
      poseCanvas.height = video.videoHeight || 480;
      poseCtx.fillStyle = '#07090f';
      poseCtx.fillRect(0, 0, poseCanvas.width, poseCanvas.height);
      if (!results.poseLandmarks) return;

      const lm = results.poseLandmarks;
      drawConnectors(poseCtx, lm, POSE_CONNECTIONS, { color:'rgba(0,180,255,0.55)', lineWidth:2 });
      drawLandmarks(poseCtx, lm, { color:'rgba(0,229,160,0.9)', lineWidth:1, radius:3 });

      atualizarDebug(inferirLocal(lm));   // ← atualiza painel SEM esperar backend

      const agora = Date.now();
      if (agora - ultimoEnvio < INTERVALO_MS) return;
      ultimoEnvio = agora;
      enviarFrame(lm);
    }

    let cameraAtiva = null;   // stream atual

    function setActiveBtn(modo) {
      const f = document.getElementById('btnFrontal');
      const t = document.getElementById('btnTraseira');
      f.style.background = modo === 'user'        ? 'rgba(0,180,255,.18)' : 'rgba(0,180,255,.04)';
      f.style.color      = modo === 'user'        ? 'var(--cyan)'          : '#4a5a70';
      f.style.borderColor= modo === 'user'        ? 'var(--cyan)'          : 'rgba(0,180,255,.3)';
      t.style.background = modo === 'environment' ? 'rgba(0,180,255,.18)' : 'rgba(0,180,255,.04)';
      t.style.color      = modo === 'environment' ? 'var(--cyan)'          : '#4a5a70';
      t.style.borderColor= modo === 'environment' ? 'var(--cyan)'          : 'rgba(0,180,255,.3)';
    }

    async function iniciar(facingMode = 'user') {
      // Para stream anterior se existir
      if (cameraAtiva) { cameraAtiva.getTracks().forEach(t => t.stop()); cameraAtiva = null; }
      setActiveBtn(facingMode);
      document.getElementById('statusTxt').textContent  = 'iniciando...';

      // getUserMedia — frontal por padrao, traseira como fallback
      let stream = null;
      const tentativas = [
        { video: { facingMode: { ideal: 'user' } }, audio: false },
        { video: { facingMode: { ideal: 'environment' } }, audio: false },
        { video: true, audio: false },
      ];
      for (const constraints of tentativas) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          break;
        } catch (e) {
          log('Tentativa falhou: ' + e.message, 'err');
        }
      }
      if (!stream) {
        log('Nenhuma camera disponivel', 'err');
        setActiveBtn(null);
        return;
      }
      video.srcObject = stream;
      video.setAttribute('playsinline', true);
      await new Promise(resolve => { video.onloadedmetadata = resolve; });
      await video.play();
      log('Stream ativo — video visivel', 'ok');

      // Esconde canvas ate MP confirmar que esta rodando
      poseCanvas.style.display = 'none';

      const pose = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
      pose.setOptions({
        modelComplexity:        0,     // 0 = lite, muito mais rapido no mobile
        smoothLandmarks:        true,
        enableSegmentation:     false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence:  0.5,
      });

      let poseOk = false;
      pose.onResults((results) => {
        if (!poseOk) {
          poseOk = true;
          poseCanvas.style.display = 'block';
          log('Pose pronto', 'ok');
        }
        onResults(results);
      });

      // Dispara o primeiro envio pra forcar o WASM a inicializar
      try {
        await pose.send({ image: video });
        log('Modelo carregando...', 'info');
      } catch (err) {
        log('Pose init: ' + err.message, 'err');
      }

      async function loop() {
        if (video.readyState >= 2) {
          try { await pose.send({ image: video }); } catch (_) {}
        }
        requestAnimationFrame(loop);
      }
      loop();

      document.getElementById('statusTxt').textContent = 'camera ativa';
      document.getElementById('statusTxt').style.color = '#00b4ff';
      document.getElementById('intervaloTxt').textContent = INTERVALO_MS + 'ms';

      log('MediaPipe Pose iniciado', 'info');
      log('Backend: ' + BACKEND, 'info');
    }
  </script>
</body>
</html>
